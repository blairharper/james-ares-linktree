.label b{display:inline-block;margin-left:16px;padding:8px 12px;background:var(--bone-100);color:var(--ink-950);clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px)}
h1{align-self:end;margin:0;font:900 236px/.88 "Big Shoulders Display",sans-serif;letter-spacing:.005em;text-transform:uppercase;color:var(--bone-100)}
.avatar{align-self:end;filter:drop-shadow(8px 8px 0 var(--emerald-500))}
.avatar img{display:block;width:372px;height:372px;object-fit:cover;clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,var(--c) 100%,0 calc(100% - var(--c)),0 var(--c))}
